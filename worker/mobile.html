<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><meta name="theme-color" content="#131717"><title>Зал и бег</title>
<style>
:root{color-scheme:dark;--bg:#131717;--panel:#202626;--line:#394444;--fg:#f2f5ef;--muted:#b5c2bc;--lime:#d4ff58;--blue:#97dafe}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif}main{max-width:740px;margin:auto;padding:20px 14px 150px}h1,h2,h3,p{margin:0 0 9px}h1{font-size:34px;line-height:1}h2{font-size:24px}a{color:var(--blue)}.muted{color:var(--muted)}.tag{color:var(--lime);font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.run{color:var(--blue)}.panel{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:9px}button,input,select{font:inherit}button,input,select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:#171c1c;color:var(--fg);padding:8px 11px}button{cursor:pointer}button.primary,button[aria-current=true]{background:var(--lime);color:#141900;border-color:var(--lime);font-weight:750}button:disabled{opacity:.5}input,select{width:100%}label{font-size:.86rem;color:var(--muted)}progress{display:block;width:100%;height:12px;accent-color:var(--lime);margin:7px 0 10px}.bottom{position:fixed;z-index:3;bottom:0;left:0;right:0;background:#131717;border-top:1px solid var(--line);padding:7px 12px max(8px,env(safe-area-inset-bottom));}.bottom>div{max-width:710px;margin:auto;display:flex;gap:8px}.bottom button{flex:1}.bottom #action:not([hidden]){display:block;width:min(710px,100%);margin:0 auto 7px}.slots button{font-size:.88rem}details{margin-top:8px}summary{cursor:pointer;padding:8px 0}.timer{border-left:3px solid var(--lime)}img{max-width:100%;height:auto}dialog{max-width:min(90vw,510px);max-height:75dvh;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg)}dialog::backdrop{background:#000a}#screen>.panel{animation:enter .16s ease-out}@keyframes enter{from{opacity:.75;transform:translateY(3px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style></head><body><main><header><p class="tag">12 недель · набор мышечной массы</p><h1>Зал и бег</h1><p id="sync" class="muted" role="status">Подключение…</p></header><section id="screen"></section></main>
<div class="bottom"><button id="action" class="primary" hidden></button><div><button data-tab="today">Сегодня</button><button data-tab="plan">План</button><button data-tab="history">История</button></div></div>
<dialog id="tech"><h2 id="techTitle"></h2><p id="techBody"></p><p id="techLinks"></p><button id="closeTech">Закрыть</button></dialog><input id="importFile" type="file" accept=".json,application/json" hidden>
<script>@@JS@@</script></body></html>
